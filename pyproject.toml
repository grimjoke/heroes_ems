[project]
name = "heroes-sim"
version = "0.1.0"
description = "Headless closed-loop EMG-driven EMS simulation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "pandas",
    "pyarrow",
    "mujoco",
    "myosuite",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heroes_control", "src/heroes_safety", "src/heroes_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.uv]
package = true
