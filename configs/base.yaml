timing:
  physics_hz: 2000
  emg_hz: 2000
  controller_hz: 100
  stim_hz: 30                 # D15: off 25 Hz (= mains / 2: every blank at the same mains phase); event clock
  angle_sensor_hz: 100

plant:
  model_file: null            # null -> resolve from installed myosuite
  model_relpath: simhive/myo_sim/elbow/myoelbow_1dof6muscles.xml
  joints: [r_elbow_flex]
  muscles: [BIClong, BICshort, BRA, TRIlong, TRIlat, TRImed]
  muscle_groups:              # sign: +1 flexion, -1 extension; checked against model moment arms
    elbow_flexors: {joint: r_elbow_flex, sign: 1, muscles: [BIClong, BICshort, BRA]}
    elbow_extensors: {joint: r_elbow_flex, sign: -1, muscles: [TRIlong, TRIlat, TRImed]}
  forearm_body: r_ulna_radius_hand
  gravity: true
  exo_payload:
    mass_kg: 0.0
    pos_m: [0.0, -0.15, 0.0]  # in forearm body frame

passive_drop:
  duration_s: 3.0
  q0_rad: 1.5

metrics:
  settle_s: 1.0
  step_jump_rad: 0.05
  tolerance_rad: 0.1          # time-to-target: first |q - target| < this after a step

calibration:                  # MVC protocol; runs before every closed-loop episode unless scenario.mvc is set
  lock_q: [1.5708]            # isometric at 90 deg
  rest_s: 2.0
  window_s: 1.0
  trials:
    - {group: elbow_flexors, effort_s: 3.0}
    - {group: elbow_extensors, effort_s: 3.0}
  stim_rest:                  # D14: rest with stim at a typical level, arm supported (locked)
    duration_s: 30.0
    settle_s: 2.0
    intensity: {biceps_stim: 0.2, triceps_stim: 0.2}
  quality:
    min_rest_over_floor: 1.5  # resting EMG std must exceed 1.5 x amplifier noise floor (H4)

emg:
  channels:                   # weights = row of S[J, M]; off-target weights are crosstalk
    - name: biceps
      mvc_group: elbow_flexors
      weights: {BIClong: 1.0, BICshort: 1.0, BRA: 0.3, TRIlong: 0.05, TRIlat: 0.05, TRImed: 0.02}
    - name: triceps
      mvc_group: elbow_extensors
      weights: {TRIlong: 1.0, TRIlat: 1.0, TRImed: 0.5, BIClong: 0.05, BICshort: 0.05, BRA: 0.02}
  volitional:
    enabled: true
    band_hz: [20.0, 450.0]
    order: 4
    amplitude_mv: {BIClong: 0.5, BICshort: 0.5, BRA: 0.5, TRIlong: 0.4, TRIlat: 0.4, TRImed: 0.4}
  white_noise:
    enabled: true
    std_mv: 0.005
  stim_artifact:              # electrode proximity: own electrode >> the other one
    enabled: true
    amplitude_mv:
      biceps: {biceps_stim: 8.0, triceps_stim: 1.0}
      triceps: {biceps_stim: 1.0, triceps_stim: 8.0}
    decay_ms: 2.0
  m_wave:
    enabled: true
    amplitude_mv: {BIClong: 3.0, BICshort: 3.0, BRA: 2.0, TRIlong: 2.5, TRIlat: 2.5, TRImed: 2.0}
    latency_ms: 4.0
    duration_ms: 10.0
  powerline:
    enabled: true
    freq_hz: 50.0
    amplitude_mv: [0.02, 0.006, 0.003]
  baseline_wander:
    enabled: true
    std_mv: 0.05
    cutoff_hz: 0.5
  motion:
    enabled: false
    gain_mv_per_rad_s:
      biceps: {r_elbow_flex: 0.05}
      triceps: {r_elbow_flex: 0.05}
  amplifier:                  # rail = supply_v / 2 / raw_gain, input-referred (3.3 V, 200 -> 8.25 mV)
    supply_v: 3.3             # H1: 3.3 or 5 V? (5 V -> 12.5 mV)
    raw_gain: 200.0           # H1: reported RAW gain; verify on the bench
    overload_recovery_ms: 5.0 # H2: placeholder until measured (datasheet: CMOS amps recover slowly)

angle_sensor:
  noise_std_rad: 0.003
  bias_walk_std_rad_per_sqrt_s: 0.001
  latency_ms: 10.0
  resolution_rad: 0.001

stim:
  n_steps: 128                # 7-bit digital pot
  recruitment: {threshold: 0.35, slope: 12.0, saturation: 0.9}
  em_delay_ms: 25.0
  combine: probabilistic_sum
  impedance_ohm: 1000.0       # electrode impedance at full contact, reported per pulse (placeholder)
  fatigue:                    # dC/dt = -f * r * C + k * (1 - C) per muscle; model: none | exponential
    model: exponential
    fatigue_rate_per_s: 0.05  # at full recruitment: capacity halves in ~14 s (r = 0.3: ~46 s)
    recovery_rate_per_s: 0.01 # recovery time constant ~100 s
  channels:                   # muscles = column of E[M, K]; off-target weights are crosstalk
    - {name: biceps_stim, joint: r_elbow_flex, sign: 1, muscles: {BIClong: 0.9, BICshort: 0.9, BRA: 0.3}}
    - {name: triceps_stim, joint: r_elbow_flex, sign: -1, muscles: {TRIlong: 0.8, TRIlat: 0.9, TRImed: 0.6}}

controller:
  bandpass_hz: [20.0, 450.0]
  bandpass_order: 4
  envelope_hz: 4.0
  envelope_order: 2
  blanking_ms: 15.0           # software blanking (EMG amp has none); covers M-wave (4 + 10 ms); sweep at M5
  blanking_fill: interp       # D15: line across the blank (delays EMG by window + 1 sample); hold | zero for comparison
  blanking_correction: false  # must be true with zero fill, false otherwise
  notch_hz: [50.0]            # D15: mains notch AFTER blanking (before it, artifact spikes make it ring)
  notch_q: 30.0
  mains_canceller: null       # D17 (open): {freqs_hz: [50, 100, 150], mu: 0.002, mu_bias: 0.02}
  deadband_floor: 0.05        # D14: deadband = max(floor, percentile of |intent| at stim-on rest)
  deadband_percentile: 99.0
  allocation:                 # recruitment-threshold offset; 0 = plain split (sweep at M5)
    offset: 0.0
    epsilon: 0.02             # the offset applies only above this PD output
  derivative_tau_s: 0.02
  latency_ticks: 1            # 10 ms compute latency
  joints:                     # D6: damping 10 -> G/b = 5 rad/s per intent, tau 100 ms. D18: kp 0.3 interim (>= 0.4 crosses the joint limit holding flexed)
    r_elbow_flex: {agonist: biceps, antagonist: triceps, gain: 50.0, damping: 10.0, rom: [0.1, 2.1], kp: 0.3, kd: 0.03}

safety:
  cap: {biceps_stim: 0.8, triceps_stim: 0.8}
  max_rise_per_tick: 0.05
  joint_limits: {r_elbow_flex: [0.0, 2.27]}
  rom_margin_rad: 0.1
  dose_window_s: 10.0
  dose_max_mean: 0.5
  watchdog_timeout_s: 0.05
  q_plausible: {r_elbow_flex: [-0.3, 2.6]}
  emg_plausible_abs_mv: 20.0
  # D10-D12 detectors. Thresholds from 395 fault-free M5 sweep runs (see README):
  emg_rail_min_samples: 10    # of 20 per chunk at |x| >= 0.98 x rail (emg.amplifier); 0 seen fault-free
  emg_dead_ratio: 0.5         # chunk std / calibrated resting std; fault-free never < 0.5 for > 3 ticks
  emg_dead_ticks: 10
  emg_dead_latch: true        # D16: lead-off stays latched until an operator reset
  emg_dead_reset_s: 3.0       # reset accepted only after the channel has been live this long
  angle_max_age_s: 0.05       # primary (D11): message age; sensor latency 10 ms + one 10 ms tick
  angle_repeat_ticks: 10      # fallback (D11): identical readings; fault-free max 5 over 395 runs
  impedance_max_ohm: null     # D12/H7: this stimulator reports no impedance -> no data source (hardware risk)
